name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only creates the GitHub release here. The app store release happens in
    # nextcloud-releases/eurooffice, see RELEASING.md.
    if: ${{ github.repository_owner == 'Euro-Office' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches CHANGELOG.md and info.xml
        env:
          tag: ${{ github.ref_name }}
        run: |
          changelog=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)
          infoxml=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "tag=$tag changelog=$changelog info.xml=$infoxml"
          [ "$tag" = "v$changelog" ] && [ "$tag" = "v$infoxml" ]
      - name: Generate Changelog
        run: |
          awk '/## [0-9]/{p++} p; /## [0-9]/{if (p > 1) exit}' CHANGELOG.md | awk 'NR>2 {print last} {last=$0}' > RELEASE.md
      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
