name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Euro-Office' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Verify tag matches CHANGELOG.md and info.xml
        run: |
          tag='${{ github.ref_name }}'
          changelog=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)
          infoxml=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "tag=$tag changelog=$changelog info.xml=$infoxml"
          [ "$tag" = "v$changelog" ] && [ "$tag" = "v$infoxml" ]
      - name: Generate Changelog
        run: |
          awk '/## [0-9]/{p++} p; /## [0-9]/{if (p > 1) exit}' CHANGELOG.md | awk 'NR>2 {print last} {last=$0}' > RELEASE.md
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
          # A release created with GITHUB_TOKEN does not trigger appstore-build-publish.yml
          token: ${{ secrets.RELEASE_TOKEN }}
