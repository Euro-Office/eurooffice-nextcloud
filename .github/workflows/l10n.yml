name: l10n

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'stable*']
  push:
    # main: a source change means the pot file needs rebuilding, which lands
    # through a pull request.
    # weblate-translations: Weblate wrote po files, so l10n/ needs rebuilding.
    branches: [main, weblate-translations]

permissions:
  contents: read

# Two quick pushes would race to publish to the same branch
concurrency:
  group: l10n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    name: regenerate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the publishing steps get the robot token
          persist-credentials: false

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gettext
        # The Ubuntu mirrors sometimes fail to resolve for a few minutes
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 gettext && exit 0
            sleep 20
          done
          exit 1

      - name: Test the regeneration script
        run: .github/scripts/test-regenerate-l10n.sh

      - name: Regenerate translationfiles and l10n
        run: .github/scripts/regenerate-l10n.sh

      - name: Verify the committed files are up to date
        if: github.event_name == 'pull_request'
        run: |
          git add -A -- translationfiles l10n
          git diff --cached --exit-code --stat || {
            git diff --cached
            echo "::error::translationfiles/ or l10n/ is out of date."
            echo "Apply the diff above with git apply, or run .github/scripts/regenerate-l10n.sh on ubuntu-24.04 (gettext 0.21), then commit."
            exit 1
          }

      # github.token cannot push to protected branches, and its pushes do not
      # start the other workflows on the new commit
      - name: Require the robot token
        if: github.event_name != 'pull_request'
        env:
          HAS_ROBOT_TOKEN: ${{ secrets.EO_ROBOT_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_ROBOT_TOKEN" != "true" ]; then
            echo "::error::EO_ROBOT_GITHUB_TOKEN is required to publish the regenerated files."
            exit 1
          fi

      # Lands the generated files inside Weblate's own pull request. Weblate
      # rebases its branch, so this commit can be dropped; the workflow simply
      # runs again and re-adds it.
      - name: Push to the Weblate branch
        if: github.event_name != 'pull_request' && github.ref_name == 'weblate-translations'
        env:
          TOKEN: ${{ secrets.EO_ROBOT_GITHUB_TOKEN }}
        run: |
          git config user.name "euro-office-robot"
          git config user.email "noreply@euro-office.org"
          git add translationfiles l10n
          git diff --cached --quiet && echo "nothing to do" && exit 0
          git commit -s -m "chore(l10n): regenerate translation files"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      # main only takes pull requests, so open one or update the open one
      - name: Open a pull request
        if: github.event_name != 'pull_request' && github.ref_name != 'weblate-translations'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.EO_ROBOT_GITHUB_TOKEN }}
          branch: l10n/update-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          add-paths: |
            translationfiles
            l10n
          delete-branch: true
          signoff: true
          author: euro-office-robot <noreply@euro-office.org>
          committer: euro-office-robot <noreply@euro-office.org>
          commit-message: "chore(l10n): regenerate translation files"
          title: "chore(l10n): regenerate translation files"
          body: Generated by the l10n workflow from the source strings on `${{ github.ref_name }}`.
