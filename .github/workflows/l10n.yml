name: l10n

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'stable*']
  push:
    # main: a source change means the pot file needs rebuilding.
    # weblate-translations: Weblate wrote po files, so l10n/ needs rebuilding.
    # Committing here lands the generated files inside Weblate's own pull
    # request instead of opening a second one.
    branches: [main, weblate-translations]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    name: regenerate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests only verify, so they do not need the robot token,
          # and it is not available to forks anyway.
          token: ${{ secrets.EO_ROBOT_GITHUB_TOKEN || github.token }}

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gettext
        # The Ubuntu mirrors sometimes fail to resolve for a few minutes
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 gettext && exit 0
            sleep 20
          done
          exit 1

      # Pinned so an upstream change cannot silently change the generated files.
      - name: Fetch translationtool
        run: |
          curl -sSfLo /tmp/translationtool.phar \
            https://raw.githubusercontent.com/nextcloud/docker-ci/5ed96fa6f9535415f9da1e672f38d7f7c659b2ee/translations/translationtool/translationtool.phar
          echo "667ca0a3d7ca8858f66f72007792d5bbab867dba6b1bb458d95ec7a74f17385f  /tmp/translationtool.phar" | sha256sum -c -

      # Both are no-ops when nothing changed, so there is no need to work out
      # what this push touched.
      - name: Extract source strings
        run: php /tmp/translationtool.phar create-pot-files

      # The output must not depend on the time or the checkout path, or CI and
      # a developer's machine never agree and every run commits again:
      # - xgettext stamps the current time into POT-Creation-Date, and msgmerge
      #   copies it into every po
      # - source references are absolute paths, and xgettext wraps them by
      #   length before they are stripped
      # - translationtool derives .vue hints from the fake file it builds and
      #   truncates the path by a fixed offset, leaving a fragment that varies
      #   with the checkout path (real TRANSLATORS comments do not end in a
      #   .vue line number, so they survive)
      # References keep the file but drop the line number (one per line), so a
      # pull request that only moves a string does not touch translationfiles/.
      # gettext 0.21 on ubuntu-24.04 has no --add-location=file, hence awk.
      # translationtool only writes the pot; msgmerge makes the po files learn
      # about new source strings so Weblate can show them.
      - name: Update and normalise translationfiles
        run: |
          normalise() {
            for f in "$@"; do
              sed -E -e '/^"POT-Creation-Date: /d' -e "s|$(pwd -P)/||g" \
                -e '/^#\. TRANSLATORS .*\.vue:[0-9]+$/d' "$f" |
              awk '
                /^#: / { for (i = 2; i <= NF; i++) { sub(/:[0-9]+$/, "", $i); if (!seen[$i]++) refs[++n] = $i } next }
                { for (i = 1; i <= n; i++) print "#: " refs[i]; n = 0; split("", seen); print }
                END { for (i = 1; i <= n; i++) print "#: " refs[i] }
              ' > "$f.tmp"
              mv "$f.tmp" "$f"
            done
          }
          normalise translationfiles/templates/eurooffice.pot
          for po in translationfiles/*/*.po; do
            msgmerge --quiet --update --backup=none --no-fuzzy-matching \
              "$po" translationfiles/templates/eurooffice.pot
          done
          normalise translationfiles/*/*.po
          ! grep -rq "$(pwd -P)" translationfiles/

      - name: Convert po files to l10n
        run: php /tmp/translationtool.phar convert-po-files

      - name: Verify the committed files are up to date
        if: github.event_name == 'pull_request'
        run: |
          git add -A -- translationfiles l10n
          git diff --cached --exit-code --stat || {
            echo "::error::translationfiles/ or l10n/ is out of date."
            echo "Run translationtool create-pot-files and convert-po-files, then commit."
            exit 1
          }

      - name: Commit if anything changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "euro-office-robot"
          git config user.email "noreply@euro-office.org"
          git add translationfiles l10n
          git diff --cached --quiet && echo "nothing to do" && exit 0
          git commit -m "chore(l10n): regenerate translation files"
          # Weblate rebases its branch, so this commit can be dropped; the
          # workflow simply runs again and re-adds it.
          git push origin "HEAD:${GITHUB_REF_NAME}"
