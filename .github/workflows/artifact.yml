name: Artifact

on:
  workflow_dispatch:
  push:
    branches: [main, 'stable*']
  pull_request:
    branches: [main, 'stable*']

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Get Info
        run: |
          echo "version=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)" >> $GITHUB_OUTPUT
        id: info
      - name: Build Artifact
        run: |
          cd ${{ github.workspace }}
          cwd=$(pwd)
          git submodule update --init --recursive
          npm install
          npm run build
          composer install --no-dev --optimize-autoloader
          mkdir -p eurooffice
          rsync -av --exclude='eurooffice' . eurooffice
          cd eurooffice
          rm -rf ./.github/
          rm -rf ./.git/
          rm -rf ./assets/document-templates/.git
          rm -rf ./assets/document-templates/sample/
          rm -rf ./assets/document-formats/.git
          rm -rf ./node_modules/
          rm -rf ./src/
          rm -rf ./tests/
          rm ./phpunit.xml
          rm ./.eslintrc.js
          rm ./.gitignore
          rm ./.gitmodules
          rm ./.stylelintrc.json
          rm ./composer.json
          rm ./composer.lock
          rm ./npm-shrinkwrap.json
          rm ./package.json
          rm ./ruleset.xml
          rm ./stylelint.config.js
          rm ./vite.config.mjs
          cd $cwd
          tar -czvf eurooffice.tar.gz eurooffice
      - name: Verify what the artifact contains
        run: |
          set -eu
          if tar tzf eurooffice.tar.gz | grep -q 'document-templates/sample/'; then
            echo "::error::document-templates/sample/ leaked into the artifact"
            exit 1
          fi
          if tar tzf eurooffice.tar.gz | grep -qE '/(tests/|phpunit\.xml)'; then
            echo "::error::tests/ or phpunit.xml leaked into the artifact"
            exit 1
          fi
          locales=$(tar tzf eurooffice.tar.gz | grep -c 'document-templates/new/.*/new\.docx' || true)
          echo "bundled locales: $locales"
          if [ "$locales" -lt 40 ]; then
            echo "::error::empty-document templates are missing from the artifact ($locales locales)"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: eurooffice
          path: eurooffice.tar.gz

  # The artifact job prunes with an explicit rm list; the appstore tarball is
  # filtered by .nextcloudignore via krankerl instead. Those are two different
  # mechanisms, and appstore-build-publish.yml only runs on release, so without
  # this job the production filter is never exercised before a tag.
  package-filter:
    runs-on: ubuntu-latest
    name: Packaging filter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install krankerl
        run: |
          wget -q https://github.com/ChristophWurst/krankerl/releases/download/v0.14.0/krankerl_0.14.0_amd64.deb
          sudo dpkg -i krankerl_0.14.0_amd64.deb
      - name: Package with krankerl
        run: krankerl package
      - name: Verify what the appstore tarball contains
        run: |
          set -eu
          tarball=build/artifacts/eurooffice.tar.gz
          if tar tzf "$tarball" | grep -q 'document-templates/sample/'; then
            echo "::error::document-templates/sample/ leaked into the appstore tarball; check .nextcloudignore"
            exit 1
          fi
          if tar tzf "$tarball" | grep -qE '/(tests/|phpunit\.xml)'; then
            echo "::error::tests/ or phpunit.xml leaked into the appstore tarball; check .nextcloudignore"
            exit 1
          fi
          locales=$(tar tzf "$tarball" | grep -c 'document-templates/new/.*/new\.docx' || true)
          echo "bundled locales: $locales"
          if [ "$locales" -lt 40 ]; then
            echo "::error::.nextcloudignore is excluding the templates themselves ($locales locales)"
            exit 1
          fi
