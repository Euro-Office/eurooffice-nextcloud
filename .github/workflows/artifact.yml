name: Artifact

on:
  workflow_dispatch:
  push:
    branches: [main, 'stable*']
  pull_request:
    branches: [main, 'stable*']

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Get Info
        run: |
          echo "version=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)" >> $GITHUB_OUTPUT
        id: info
      - name: Build Artifact
        run: |
          cd ${{ github.workspace }}
          cwd=$(pwd)
          git submodule update --init --recursive
          npm install
          npm run build
          composer install --no-dev --optimize-autoloader
          mkdir -p eurooffice
          rsync -av --exclude='eurooffice' . eurooffice
          cd eurooffice
          rm -rf ./.github/
          rm -rf ./.git/
          rm -rf ./assets/document-templates/.git
          rm -rf ./assets/document-formats/.git
          rm -rf ./node_modules/
          rm -rf ./src/
          rm ./.eslintrc.js
          rm ./.gitignore
          rm ./.gitmodules
          rm ./.stylelintrc.json
          rm ./composer.json
          rm ./composer.lock
          rm ./npm-shrinkwrap.json
          rm ./package.json
          rm ./ruleset.xml
          rm ./stylelint.config.js
          rm ./vite.config.mjs
          cd $cwd
          tar -czvf eurooffice.tar.gz eurooffice
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: eurooffice
          path: eurooffice.tar.gz